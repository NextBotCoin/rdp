
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP and Firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1 -Force

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          Write-Host 'RDP settings and firewall configured.'

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Missing repository secret: RDP_PASSWORD'
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name 'RDP' `
              -Password $securePass `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name 'RDP' -Password $securePass
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member 'RDP' `
            -ErrorAction SilentlyContinue

          Write-Host 'RDP account configured.'

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.104.2-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          $p = Start-Process msiexec.exe `
            -ArgumentList @('/i', $installer, '/quiet', '/norestart') `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($p.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed with code $($p.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTH_KEY)) {
            throw 'Missing repository secret: TAILSCALE_AUTH_KEY'
          }

          $exe = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'

          & $exe up "--authkey=$env:TS_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale connection failed.'
          }

          $ip = $null

          for ($i = 0; $i -lt 12; $i++) {
            Start-Sleep -Seconds 5
            $result = & $exe ip -4

            if ($LASTEXITCODE -eq 0 -and $result) {
              $ip = ($result | Select-Object -First 1).Trim()
              if ($ip) { break }
            }
          }

          if (-not $ip) {
            throw 'Could not obtain a Tailscale IPv4 address.'
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Verify RDP Port
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $service = Get-Service -Name TermService
          if ($service.Status -ne 'Running') {
            Start-Service -Name TermService
          }

          $listening = $false

          for ($i = 0; $i -lt 12; $i++) {
            $check = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($check.TcpTestSucceeded) {
              $listening = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $listening) {
            throw 'RDP port 3389 is not listening.'
          }

          Write-Host "RDP address: $env:TAILSCALE_IP"
          Write-Host 'RDP port is listening.'

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host 'Username: RDP'
          Write-Host 'Password: configured in repository secret'

          while ($true) {
            Write-Host "Runner active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
